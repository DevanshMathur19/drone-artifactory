pipeline:
  name: Artifactory Plugin - Node KubernetesDirect Qualification-dm
  identifier: artifactory_plugin_node_qualify_dm
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  variables:
  - name: dockerConnector
    type: String
    value: dmdockerconn
  - name: namespace
    type: String
    value: cie-test
  - name: jfrogUrl
    type: String
    value: https://oidctest.jfrog.io/artifactory
  - name: jfrogUsername
    type: String
    value: chirags.221cs214@nitk.edu.in
  - name: jfrogPassword
    type: Secret
    value: chiragoidctestPAT
  - name: jfrogAccessToken
    type: Secret
    value: chiragoidctestPAT
  - name: node18LinuxAmd64Candidate
    type: String
    value: <+input>.default("")
  - name: node18LinuxArm64Candidate
    type: String
    value: <+input>.default("")
  - name: node22LinuxAmd64Candidate
    type: String
    value: <+input>.default("")
  - name: node22LinuxArm64Candidate
    type: String
    value: <+input>.default("")
  - name: node24LinuxAmd64Candidate
    type: String
    value: <+input>.default("")
  - name: node24LinuxArm64Candidate
    type: String
    value: <+input>.default("")
  - name: node18Windows2019Candidate
    type: String
    value: <+input>.default("")
  - name: node22Windows2019Candidate
    type: String
    value: <+input>.default("")
  - name: node24Windows2019Candidate
    type: String
    value: <+input>.default("")
  - name: node18Windows2022Candidate
    type: String
    value: <+input>.default("")
  - name: node22Windows2022Candidate
    type: String
    value: <+input>.default("")
  - name: node24Windows2022Candidate
    type: String
    value: <+input>.default("")
  - name: node18Windows2025Candidate
    type: String
    value: <+input>.default("")
  - name: node22Windows2025Candidate
    type: String
    value: <+input>.default("")
  - name: node24Windows2025Candidate
    type: String
    value: <+input>.default("")
  - name: qualifyLinux
    type: String
    value: <+input>.default("true")
  - name: qualifyWindows
    type: String
    value: <+input>.default("true")
  - name: npmRepositoryPrefix
    type: String
    value: artifactory-node-dm
  - name: linuxQualificationScript
    type: String
    value: |-
      set -eu

      case "${CANDIDATE_IMAGE}" in
        *@sha256:????????????????????????????????????????????????????????????????) ;;
        *) echo "Node candidate must be digest pinned" >&2; exit 1 ;;
      esac

      for command in jf jfrog node npm npx curl; do
        command -v "$command" >/dev/null
      done
      [ "$(node --version | sed 's/^v//')" = "${EXPECTED_NODE_VERSION}" ]

      for version in 5.6.0 6.4.1 6.11.3 6.14.4 6.14.7 6.14.8; do
        npm_cli="/opt/npm/${version}/bin/npm-cli.js"
        [ -f "$npm_cli" ]
        [ "$(node "$npm_cli" --version)" = "$version" ]
      done

      artifactory=${JFROG_URL%/}
      platform=${artifactory%/artifactory}
      host=$(printf '%s' "$platform" | sed -E 's#^https?://([^/:]+).*#\1#')
      ping=$(curl --fail --silent --show-error --user "${JFROG_USERNAME}:${JFROG_PASSWORD}" "$artifactory/api/system/ping")
      [ "$ping" = "OK" ]

      repo="${NPM_REPOSITORY_PREFIX}-linux-${TARGET_ARCH}"
      repo_status=$(curl --silent --output /tmp/repo-probe --write-out '%{http_code}' --user "${JFROG_USERNAME}:${JFROG_PASSWORD}" "$artifactory/api/repositories/$repo")
      case "$repo_status" in
        200) ;;
        400|404)
          create_status=$(curl --silent --output /tmp/repo-create --write-out '%{http_code}' --request PUT --user "${JFROG_USERNAME}:${JFROG_PASSWORD}" --header 'Content-Type: application/json' --data "{\"key\":\"$repo\",\"rclass\":\"local\",\"packageType\":\"npm\",\"repoLayoutRef\":\"npm-default\"}" "$artifactory/api/repositories/$repo")
          case "$create_status" in 200|201) ;; *) cat /tmp/repo-create >&2; exit 1 ;; esac
          ;;
        *) cat /tmp/repo-probe >&2; exit 1 ;;
      esac

      project="fixture node${NODE_MAJOR} linux ${TARGET_ARCH}"
      package_name="artifactory-node${NODE_MAJOR}-linux-${TARGET_ARCH}-${PIPELINE_SEQUENCE_ID}"
      package_version="1.0.${PIPELINE_SEQUENCE_ID}"
      mkdir -p "$project"
      printf '{"name":"%s","version":"%s","description":"Artifactory npm qualification","license":"UNLICENSED"}\n' "$package_name" "$package_version" >"$project/package.json"
      (cd "$project" && node /opt/npm/6.14.8/bin/npm-cli.js install --package-lock-only --ignore-scripts)

      invoke_publisher() {
        operation=$1; url=$2; auth_mode=$3; npm_version=$4; publish_build_info=$5; expect_success=$6
        build_name="artifactory-node${NODE_MAJOR}-linux-${TARGET_ARCH}-${operation}"
        export PLUGIN_BUILD_TOOL=npm PLUGIN_COMMAND="$operation" PLUGIN_URL="$url"
        export PLUGIN_PROJECT_DIR="$project" PLUGIN_REPO_RESOLVE="$repo" PLUGIN_REPO_DEPLOY="$repo"
        export PLUGIN_RESOLVER_ID="npm-resolve-${NODE_MAJOR}-linux-${TARGET_ARCH}-${operation}-${auth_mode}"
        export PLUGIN_DEPLOYER_ID="npm-deploy-${NODE_MAJOR}-linux-${TARGET_ARCH}-${operation}-${auth_mode}"
        export PLUGIN_BUILD_NAME="$build_name" PLUGIN_BUILD_NUMBER="$PIPELINE_SEQUENCE_ID" PLUGIN_MODULE="$package_name"
        export PLUGIN_PUBLISH_BUILD_INFO="$publish_build_info" PLUGIN_NPM_VERSION="$npm_version"
        export JFROG_CLI_HOME_DIR="$project/.jfrog-${operation}-${auth_mode}"
        export PLUGIN_ENABLE_PROXY=true HARNESS_HTTPS_PROXY=http://127.0.0.1:9 HARNESS_NO_PROXY="$host"
        unset PLUGIN_ACCESS_TOKEN
        export PLUGIN_USERNAME="$JFROG_USERNAME"
        if [ "$auth_mode" = invalid ]; then export PLUGIN_PASSWORD=known-invalid-password; else export PLUGIN_PASSWORD="$JFROG_PASSWORD"; fi
        set +e
        output=$(/bin/plugin 2>&1)
        exit_code=$?
        set -e
        case "$output" in *"$JFROG_PASSWORD"*|*"$JFROG_ACCESS_TOKEN"*) echo "Plugin output exposed a credential" >&2; exit 1 ;; esac
        printf '%s\n' "$output"
        if [ "$expect_success" = true ]; then
          [ "$exit_code" -eq 0 ]
          publish_count=$(printf '%s\n' "$output" | grep -c 'rt build-publish' || true)
          if [ "$publish_build_info" = true ]; then
            [ "$publish_count" -eq 1 ]
            curl --fail --silent --show-error --user "${JFROG_USERNAME}:${JFROG_PASSWORD}" "$artifactory/api/build/$build_name/$PIPELINE_SEQUENCE_ID" >/dev/null
          else
            [ "$publish_count" -eq 0 ]
          fi
        else
          [ "$exit_code" -ne 0 ]
          printf '%s\n' "$output" | grep -Eiq '401|403|unauthorized|unauthorised|forbidden|authentication (failed|required)|incorrect (username or )?password|bad credentials|access denied'
        fi
      }

      invoke_publisher ci "$platform/artifactory/" password 6.14.8 true true
      invoke_publisher install "$platform" password "" false true
      invoke_publisher publish "$platform/artifactory/$repo" password 6.14.8 true true
      curl --fail --silent --show-error --user "${JFROG_USERNAME}:${JFROG_PASSWORD}" "$artifactory/api/storage/$repo/$package_name/-/$package_name-$package_version.tgz" >/dev/null
      invoke_publisher publish "$platform" invalid 6.14.8 true false
      echo "Node ${EXPECTED_NODE_VERSION} Linux ${TARGET_ARCH} npm qualification passed for ${CANDIDATE_IMAGE}"
  - name: nodeQualificationScript
    type: String
    value: |-
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $false
      Set-StrictMode -Version Latest

      $candidate = $env:CANDIDATE_IMAGE
      if ($candidate -notmatch '@(sha256:[0-9a-f]{64})$') {
        throw 'Node candidate must be digest pinned'
      }
      $expectedDigest = $Matches[1]
      if ([System.Environment]::OSVersion.Version.Build.ToString() -ne $env:EXPECTED_WINDOWS_BUILD) {
        throw "Expected Windows build $env:EXPECTED_WINDOWS_BUILD"
      }
      foreach ($command in @('pwsh', 'jf', 'jfrog', 'node', 'npm', 'npx', 'curl.exe')) {
        if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
          throw "Required command is unavailable: $command"
        }
      }
      if ((node --version).Trim().TrimStart('v') -ne $env:EXPECTED_NODE_VERSION) {
        throw "Unexpected Node version: $(node --version)"
      }
      $alternates = (& { . C:\tools\npm\Use-Npm.ps1 -List } 2>&1 | Out-String)
      foreach ($version in @('5.6.0','6.4.1','6.11.3','6.14.4','6.14.7','6.14.8')) {
        if ($alternates -notmatch [regex]::Escape($version)) { throw "Missing npm $version" }
        $npmCli = "C:\tools\npm\$version\bin\npm-cli.js"
        if (-not (Test-Path -LiteralPath $npmCli -PathType Leaf)) {
          throw "npm $version CLI is missing at $npmCli"
        }
        $actualAlternate = (& node.exe $npmCli --version 2>&1 | Out-String).Trim()
        if ($actualAlternate -ne $version) {
          throw "npm $version selector returned $actualAlternate"
        }
      }

      $privateCaPath = 'C:\temp\qualification-private-ca.pem'
      $rsa = [System.Security.Cryptography.RSA]::Create(2048)
      try {
        $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
          'CN=Artifactory npm qualification private CA',
          $rsa,
          [System.Security.Cryptography.HashAlgorithmName]::SHA256,
          [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
        )
        $request.CertificateExtensions.Add(
          [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($true, $false, 0, $true)
        )
        $certificate = $request.CreateSelfSigned([DateTimeOffset]::UtcNow.AddMinutes(-5), [DateTimeOffset]::UtcNow.AddDays(1))
        try {
          $privateCaPem = "-----BEGIN CERTIFICATE-----`n$([Convert]::ToBase64String(
            $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert),
            [Base64FormattingOptions]::InsertLineBreaks
          ))`n-----END CERTIFICATE-----`n"
        } finally {
          $certificate.Dispose()
        }
      } finally {
        $rsa.Dispose()
      }

      $tokenPath = 'C:\var\run\secrets\kubernetes.io\serviceaccount\token'
      $caPath = 'C:\var\run\secrets\kubernetes.io\serviceaccount\ca.crt'
      $token = Get-Content -LiteralPath $tokenPath -Raw
      $namespace = $env:POD_NAMESPACE
      $pod = if ($env:POD_NAME) { $env:POD_NAME } else { $env:COMPUTERNAME }
      $base = "https://$($env:KUBERNETES_SERVICE_HOST):$($env:KUBERNETES_SERVICE_PORT_HTTPS)/api/v1/namespaces/$namespace/pods"
      $curl = @('--fail','--silent','--show-error','--ssl-no-revoke','--cacert',$caPath,'-H',"Authorization: Bearer $token")
      $json = & curl.exe @curl "$base/$pod"
      if ($LASTEXITCODE -ne 0) {
        $listing = (& curl.exe @curl $base | ConvertFrom-Json).items
        $addresses = @(
          [System.Net.Dns]::GetHostAddresses([System.Net.Dns]::GetHostName()) |
            Where-Object AddressFamily -eq ([System.Net.Sockets.AddressFamily]::InterNetwork) |
            ForEach-Object IPAddressToString
        )
        $matches = @(
          $listing | Where-Object { $addresses -contains [string] $_.status.podIP }
        )
        if ($matches.Count -ne 1) {
          throw "Could not identify the current Pod by IP in namespace $namespace"
        }
        $status = $matches[0].status
      } else {
        $status = ($json | ConvertFrom-Json).status
      }
      $imageIds = @($status.containerStatuses | ForEach-Object { [string] $_.imageID })
      if (@($imageIds | Where-Object { $_ -match "@$([regex]::Escape($expectedDigest))$" }).Count -lt 1) {
        throw "Expected running imageID $expectedDigest; observed: $($imageIds -join ', ')"
      }

      $artifactory = $env:JFROG_URL.TrimEnd('/')
      $platform = $artifactory -replace '/artifactory$', ''
      $hostName = ([uri]$platform).Host
      $credentialBytes = [System.Text.Encoding]::UTF8.GetBytes("$($env:JFROG_USERNAME):$($env:JFROG_PASSWORD)")
      $headers = @{Authorization = "Basic $([Convert]::ToBase64String($credentialBytes))"}
      $ping = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -MaximumRedirection 0 -Headers $headers -Uri "$artifactory/api/system/ping"
      $pingStatus = [int] $ping.StatusCode
      if ($pingStatus -ge 300 -and $pingStatus -lt 400) {
        throw "JFrog tenant is not active; ping redirected to $($ping.Headers.Location)"
      }
      if ($pingStatus -lt 200 -or $pingStatus -ge 300 -or $ping.Content.Trim() -ne 'OK') {
        throw "JFrog Artifactory ping failed; HTTP $pingStatus`: $($ping.Content)"
      }
      $repo = "$($env:NPM_REPOSITORY_PREFIX)-ltsc$($env:LTSC)"
      $repoUri = "$artifactory/api/repositories/$repo"
      $probe = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Headers $headers -Uri $repoUri
      $probeStatus = [int] $probe.StatusCode
      if ($probeStatus -in @(400,404)) {
        $config = @{key=$repo; rclass='local'; packageType='npm'; repoLayoutRef='npm-default'} | ConvertTo-Json -Compress
        $created = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Method Put -Headers $headers -ContentType 'application/json' -Body $config -Uri $repoUri
        if ([int]$created.StatusCode -notin @(200,201)) {
          $reprobe = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Headers $headers -Uri $repoUri
          if ([int]$reprobe.StatusCode -lt 200 -or [int]$reprobe.StatusCode -ge 300) {
            throw "Could not create npm sandbox repository $repo; probe HTTP $probeStatus`: $($probe.Content); create HTTP $([int]$created.StatusCode): $($created.Content); re-probe HTTP $([int]$reprobe.StatusCode): $($reprobe.Content)"
          }
        }
      } elseif ($probeStatus -lt 200 -or $probeStatus -ge 300) {
        throw "Could not inspect npm sandbox repository $repo; HTTP $probeStatus`: $($probe.Content)"
      }

      $project = "fixture node$($env:NODE_MAJOR) ltsc$($env:LTSC)"
      New-Item -ItemType Directory -Force $project | Out-Null
      $packageName = "artifactory-node$($env:NODE_MAJOR)-ltsc$($env:LTSC)-$($env:PIPELINE_SEQUENCE_ID)"
      $packageVersion = "1.0.$($env:PIPELINE_SEQUENCE_ID)"
      @{name=$packageName; version=$packageVersion; description='Artifactory npm qualification'; license='UNLICENSED'} |
        ConvertTo-Json | Set-Content -LiteralPath "$project\package.json" -Encoding utf8
      Push-Location $project
      try {
        $npm6148 = 'C:\tools\npm\6.14.8\bin\npm-cli.js'
        $lockOutput = & node.exe $npm6148 install --package-lock-only --ignore-scripts 2>&1
        $lockExitCode = $LASTEXITCODE
        if ($lockExitCode -ne 0) {
          throw "npm 6.14.8 could not generate the qualification lockfile: $($lockOutput | Out-String)"
        }
      } finally {
        Pop-Location
      }

      function Invoke-Publisher {
        param(
          [string]$Operation,
          [string]$URL,
          [string]$AuthMode,
          [string]$NpmVersion,
          [bool]$ExpectSuccess,
          [bool]$PublishBuildInfo = $true
        )
        $buildName = "artifactory-node$($env:NODE_MAJOR)-ltsc$($env:LTSC)-$Operation"
        $env:PLUGIN_BUILD_TOOL = 'npm'
        $env:PLUGIN_COMMAND = $Operation
        $env:PLUGIN_URL = $URL
        $env:PLUGIN_PROJECT_DIR = $project
        $env:PLUGIN_REPO_RESOLVE = $repo
        $env:PLUGIN_REPO_DEPLOY = $repo
        $env:PLUGIN_RESOLVER_ID = "npm-resolve-$($env:NODE_MAJOR)-$($env:LTSC)-$Operation-$AuthMode"
        $env:PLUGIN_DEPLOYER_ID = "npm-deploy-$($env:NODE_MAJOR)-$($env:LTSC)-$Operation-$AuthMode"
        $env:PLUGIN_BUILD_NAME = $buildName
        $env:PLUGIN_BUILD_NUMBER = $env:PIPELINE_SEQUENCE_ID
        $env:PLUGIN_MODULE = $packageName
        $env:PLUGIN_PUBLISH_BUILD_INFO = $PublishBuildInfo.ToString().ToLowerInvariant()
        $env:PLUGIN_NPM_VERSION = $NpmVersion
        $env:JFROG_CLI_HOME_DIR = "$project\.jfrog-$Operation-$AuthMode-$([guid]::NewGuid().ToString('N'))"
        $env:PLUGIN_ENABLE_PROXY = 'true'
        $env:PLUGIN_PEM_FILE_CONTENTS = $privateCaPem
        $env:PLUGIN_PEM_FILE_PATH = $privateCaPath
        $env:HARNESS_HTTPS_PROXY = 'http://127.0.0.1:9'
        $env:HARNESS_NO_PROXY = $hostName
        if ($AuthMode -eq 'token') {
          Remove-Item Env:PLUGIN_USERNAME,Env:PLUGIN_PASSWORD -ErrorAction SilentlyContinue
          $env:PLUGIN_ACCESS_TOKEN = $env:JFROG_ACCESS_TOKEN
        } else {
          Remove-Item Env:PLUGIN_ACCESS_TOKEN -ErrorAction SilentlyContinue
          $env:PLUGIN_USERNAME = $env:JFROG_USERNAME
          $env:PLUGIN_PASSWORD = if ($AuthMode -eq 'invalid') { 'known-invalid-password' } else { $env:JFROG_PASSWORD }
        }
        $rawOutput = & 'C:\bin\drone-artifactory.exe' 2>&1
        $exitCode = $LASTEXITCODE
        $output = $rawOutput | Out-String
        foreach ($secret in @($env:JFROG_PASSWORD, $env:JFROG_ACCESS_TOKEN)) {
          if ($secret -and $output -match [regex]::Escape($secret)) {
            throw 'Plugin output exposed a credential'
          }
        }
        Write-Output $output
        if ($ExpectSuccess -and $exitCode -ne 0) { throw "$Operation failed with exit code $exitCode" }
        if (-not $ExpectSuccess -and $exitCode -eq 0) { throw "$Operation unexpectedly succeeded with invalid credentials" }
        if ($ExpectSuccess) {
          $publishCount = ([regex]::Matches($output, 'rt build-publish')).Count
          $expectedPublishCount = if ($PublishBuildInfo) { 1 } else { 0 }
          if ($publishCount -ne $expectedPublishCount) {
            throw "$Operation published build info $publishCount times; expected $expectedPublishCount"
          }
          if ($PublishBuildInfo) {
            $encodedName = [uri]::EscapeDataString($buildName)
            $build = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Headers $headers -Uri "$artifactory/api/build/$encodedName/$($env:PIPELINE_SEQUENCE_ID)"
            $buildStatus = [int] $build.StatusCode
            if ($buildStatus -lt 200 -or $buildStatus -ge 300) {
              throw "Build info is absent for $buildName; HTTP $buildStatus"
            }
          }
        } elseif ($output -notmatch '(?i)(401|403|unauthori[sz]ed|forbidden|authentication (failed|required)|incorrect (username or )?password|bad credentials|access denied)') {
          throw "Invalid-credential test failed for an unrelated reason: $output"
        }
      }

      Invoke-Publisher -Operation ci -URL "$platform/artifactory/" -AuthMode password -NpmVersion '6.14.8' -ExpectSuccess $true
      Invoke-Publisher -Operation install -URL $platform -AuthMode password -NpmVersion '' -ExpectSuccess $true -PublishBuildInfo $false
      if (-not (Test-Path -LiteralPath $privateCaPath -PathType Leaf)) {
        throw 'Injected private CA was not materialized'
      }
      if ((Get-Content -LiteralPath $privateCaPath -Raw).Trim() -ne $privateCaPem.Trim()) {
        throw 'Materialized private CA does not match the injected PEM'
      }
      Invoke-Publisher -Operation publish -URL "$platform/artifactory/$repo" -AuthMode password -NpmVersion '6.14.8' -ExpectSuccess $true
      $artifact = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Headers $headers -Uri "$artifactory/api/storage/$repo/$packageName/-/$packageName-$packageVersion.tgz"
      if ([int]$artifact.StatusCode -ne 200) {
        throw "Published npm package is absent; HTTP $([int]$artifact.StatusCode): $($artifact.Content)"
      }
      Invoke-Publisher -Operation publish -URL $platform -AuthMode invalid -NpmVersion '6.14.8' -ExpectSuccess $false

      Write-Output "Node $($env:EXPECTED_NODE_VERSION) LTSC $($env:LTSC) npm qualification passed for $candidate"
  stages:
  - parallel:
    - stage:
        name: Qualify Node profiles Linux AMD64
        identifier: qualify_node_profiles_linux_amd64
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.qualifyLinux> == "true"
        spec:
          cloneCodebase: false
          platform: {os: Linux, arch: Amd64}
          runtime: {type: Cloud, spec: {}}
          execution:
            steps:
            - step:
                type: Run
                name: Qualify Node 18 npm
                identifier: qualify_node18_npm
                timeout: 60m
                spec:
                  connectorRef: <+pipeline.variables.dockerConnector>
                  image: <+pipeline.variables.node18LinuxAmd64Candidate>
                  shell: Sh
                  envVariables:
                    CANDIDATE_IMAGE: <+pipeline.variables.node18LinuxAmd64Candidate>
                    EXPECTED_NODE_VERSION: 18.20.8
                    NODE_MAJOR: '18'
                    TARGET_ARCH: amd64
                    PIPELINE_SEQUENCE_ID: <+pipeline.sequenceId>
                    JFROG_URL: <+pipeline.variables.jfrogUrl>
                    JFROG_USERNAME: <+pipeline.variables.jfrogUsername>
                    JFROG_PASSWORD: <+pipeline.variables.jfrogPassword>
                    JFROG_ACCESS_TOKEN: <+pipeline.variables.jfrogAccessToken>
                    NPM_REPOSITORY_PREFIX: <+pipeline.variables.npmRepositoryPrefix>
                  command: <+pipeline.variables.linuxQualificationScript>
            - step:
                type: Run
                name: Qualify Node 22 npm
                identifier: qualify_node22_npm
                timeout: 60m
                spec:
                  connectorRef: <+pipeline.variables.dockerConnector>
                  image: <+pipeline.variables.node22LinuxAmd64Candidate>
                  shell: Sh
                  envVariables:
                    CANDIDATE_IMAGE: <+pipeline.variables.node22LinuxAmd64Candidate>
                    EXPECTED_NODE_VERSION: 22.23.2
                    NODE_MAJOR: '22'
                    TARGET_ARCH: amd64
                    PIPELINE_SEQUENCE_ID: <+pipeline.sequenceId>
                    JFROG_URL: <+pipeline.variables.jfrogUrl>
                    JFROG_USERNAME: <+pipeline.variables.jfrogUsername>
                    JFROG_PASSWORD: <+pipeline.variables.jfrogPassword>
                    JFROG_ACCESS_TOKEN: <+pipeline.variables.jfrogAccessToken>
                    NPM_REPOSITORY_PREFIX: <+pipeline.variables.npmRepositoryPrefix>
                  command: <+pipeline.variables.linuxQualificationScript>
            - step:
                type: Run
                name: Qualify Node 24 npm
                identifier: qualify_node24_npm
                timeout: 60m
                spec:
                  connectorRef: <+pipeline.variables.dockerConnector>
                  image: <+pipeline.variables.node24LinuxAmd64Candidate>
                  shell: Sh
                  envVariables:
                    CANDIDATE_IMAGE: <+pipeline.variables.node24LinuxAmd64Candidate>
                    EXPECTED_NODE_VERSION: 24.20.0
                    NODE_MAJOR: '24'
                    TARGET_ARCH: amd64
                    PIPELINE_SEQUENCE_ID: <+pipeline.sequenceId>
                    JFROG_URL: <+pipeline.variables.jfrogUrl>
                    JFROG_USERNAME: <+pipeline.variables.jfrogUsername>
                    JFROG_PASSWORD: <+pipeline.variables.jfrogPassword>
                    JFROG_ACCESS_TOKEN: <+pipeline.variables.jfrogAccessToken>
                    NPM_REPOSITORY_PREFIX: <+pipeline.variables.npmRepositoryPrefix>
                  command: <+pipeline.variables.linuxQualificationScript>
    - stage:
        name: Qualify Node profiles Linux ARM64
        identifier: qualify_node_profiles_linux_arm64
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.qualifyLinux> == "true"
        spec:
          cloneCodebase: false
          platform: {os: Linux, arch: Arm64}
          runtime: {type: Cloud, spec: {}}
          execution:
            steps:
            - step:
                type: Run
                name: Qualify Node 18 npm
                identifier: qualify_node18_npm
                timeout: 60m
                spec:
                  connectorRef: <+pipeline.variables.dockerConnector>
                  image: <+pipeline.variables.node18LinuxArm64Candidate>
                  shell: Sh
                  envVariables:
                    CANDIDATE_IMAGE: <+pipeline.variables.node18LinuxArm64Candidate>
                    EXPECTED_NODE_VERSION: 18.20.8
                    NODE_MAJOR: '18'
                    TARGET_ARCH: arm64
                    PIPELINE_SEQUENCE_ID: <+pipeline.sequenceId>
                    JFROG_URL: <+pipeline.variables.jfrogUrl>
                    JFROG_USERNAME: <+pipeline.variables.jfrogUsername>
                    JFROG_PASSWORD: <+pipeline.variables.jfrogPassword>
