                          source: access token generic/*
                          target: <+pipeline.variables.genericRepo>/access-token/ltsc2022/<+pipeline.sequenceId>/
                          build_name: access-token-generic-ltsc2022
                          build_number: <+pipeline.sequenceId>
                          publish_build_info: true
                          enable_proxy: false
                        envVariables: {JFROG_CLI_RETRIES: "3"}
                  - step:
                      type: Plugin
                      name: Generic download with access token
                      identifier: generic_download_access_token
