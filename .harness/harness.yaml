pipeline:
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: GitHub_Drone_Plugins_Org
        repoName: drone-artifactory
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Testing Stage
        identifier: Testing_Stage
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Test
                  identifier: Run_1
                  spec:
                    connectorRef: Plugins_Docker_Hub_Connector
                    image: golang:1.26.8
                    shell: Sh
                    command: |-
                      go test -cover ./...
                      sh scripts/build.sh
        description: ""
    - parallel:
        - stage:
            name: linux-amd64
            identifier: linuxamd64
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: false
                paths: []
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      name: Build binaries - branch
                      identifier: Run_1
                      type: Run
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: golang:1.25.12
                        shell: Sh
                        command: CGO_ENABLED=0 go build -v -ldflags "-X main.build=<+pipeline.sequenceId>" -a -o release/linux/amd64/plugin
                      when:
                        stageStatus: Success
                        condition: |
                          <+codebase.build.type> != "tag"
                  - step:
                      name: Build binaries - tag
                      identifier: Tag_Build_Linux_AMD64
                      type: Run
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: golang:1.25.12
                        shell: Sh
                        command: CGO_ENABLED=0 go build -v -ldflags "-X main.version=<+codebase.tag> -X main.build=<+pipeline.sequenceId>" -a -o release/linux/amd64/plugin
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: Plugin
                      name: BuildAndPushDockerPlugin
                      identifier: BuildAndPushDockerPlugin
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: plugins/docker
                        settings:
                          username: drone
                          password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                          repo: plugins/artifactory
                          dockerfile: docker/Dockerfile.linux.amd64
                          auto_tag: "true"
                          auto_tag_suffix: linux-amd64
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: BuildAndPushDockerRegistry
                      identifier: BuildAndPushDockerRegistry
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        repo: plugins/artifactory
                        tags:
                          - linux-amd64
                        caching: false
                        dockerfile: docker/Dockerfile.linux.amd64
                      when:
                        stageStatus: Success
                        condition: |
                          <+codebase.build.type> == "branch"
            description: ""
        - stage:
            name: linux-arm64
            identifier: linuxarm64
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: false
                paths: []
              platform:
                os: Linux
                arch: Arm64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      name: Build binaries - branch
                      identifier: Run_1
                      type: Run
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: golang:1.25.12
                        shell: Sh
                        command: CGO_ENABLED=0 go build -v -buildvcs=false -ldflags "-X main.build=<+pipeline.sequenceId>" -a -o release/linux/arm64/plugin
                      when:
                        stageStatus: Success
                        condition: |
                          <+codebase.build.type> != "tag"
                  - step:
                      name: Build binaries - tag
                      identifier: Tag_Build_Linux_ARM64
                      type: Run
                      spec:
                        connectorRef: Plugins_Docker_Hub_Connector
                        image: golang:1.25.12
                        shell: Sh
