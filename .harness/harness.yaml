    - stage:
        name: Manifest
        identifier: Manifest
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: GitClone
                  name: Clone RF Manifest Templates
                  identifier: clone_rf_manifest
                  spec:
                    connectorRef: RapidFortPlugins
                    build:
                      type: branch
                      spec:
                        branch: main
                    cloneDirectory: rf-plugins
                  contextType: Pipeline
              - step:
                  type: Plugin
                  name: Manifest
                  identifier: Manifest
                  spec:
                    connectorRef: Plugins_Docker_Hub_Connector
                    image: plugins/manifest
                    settings:
                      username: drone
                      password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                      auto_tag: "true"
                      ignore_missing: "true"
                      spec: docker/manifest.tmpl
                  when:
                    stageStatus: Success
                    condition: |
                      <+codebase.build.type> == "tag" || <+codebase.build.type> == "branch"
              - step:
                  type: Plugin
                  name: RF Manifest
                  identifier: rf_manifest
                  spec:
                    connectorRef: Plugins_Docker_Hub_Connector
                    image: plugins/manifest
                    settings:
                      username: <+secrets.getValue("harnesssecureusername")>
                      password: <+secrets.getValue("dockerHarnessSecurePwd")>
                      auto_tag: "true"
                      ignore_missing: "true"
                      spec: rf-plugins/drone-artifactory/manifest.tmpl
                  when:
                    stageStatus: Success
                    condition: |
                      <+codebase.build.type> == "tag" || <+codebase.build.type> == "branch"
              - step:
                  type: Run
                  name: Build Binaries
                  identifier: Build_Binaries
                  spec:
                    connectorRef: Plugins_Docker_Hub_Connector
                    image: golang:1.25.12
                    shell: Sh
                    command: |-
                      CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -v -ldflags "-X main.version=${DRONE_TAG##v} -X main.build=${DRONE_BUILD_NUMBER}" -a -o release/plugin-linux-amd64
                      CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -v -ldflags "-X main.version=${DRONE_TAG##v} -X main.build=${DRONE_BUILD_NUMBER}" -a -o release/plugin-linux-arm64
                      CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -v -ldflags "-X main.version=${DRONE_TAG##v} -X main.build=${DRONE_BUILD_NUMBER}" -a -o release/plugin-darwin-amd64
                      CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -v -ldflags "-X main.version=${DRONE_TAG##v} -X main.build=${DRONE_BUILD_NUMBER}" -a -o release/plugin-darwin-arm64
                      CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -v -ldflags "-X main.version=${DRONE_TAG##v} -X main.build=${DRONE_BUILD_NUMBER}" -a -o release/plugin-windows-amd64


                      apt-get update -y
                      apt-get install -y zstd
                      zstd release/plugin-linux-amd64
                      zstd release/plugin-linux-arm64
                      zstd release/plugin-darwin-amd64
                      zstd release/plugin-darwin-arm64
                      zstd release/plugin-windows-amd64
                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "tag"
                contextType: Pipeline
              - step:
                  type: Plugin
                  name: Release
                  identifier: Release
                  spec:
                    connectorRef: account.harnessImage
                    image: plugins/github-release
                    settings:
                      files: release/plugin-*.zst
                      title: <+trigger.tag>
                      api_key: <+secrets.getValue("ci_job_github_pat")>
                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "tag"
              - step:
                  name: Upload_Binaries_To_GCS
                  identifier: Upload_Binaries_To_GCS
                  template:
                    templateRef: Upload_Binary_GCS_TI
                    versionLabel: v1
                    templateInputs:
                      type: GCSUpload
                      spec:
                        sourcePath: /harness/release
                        target: drone-artifactory/<+trigger.tag>/
                      when:
                        condition: <+codebase.build.type> == "tag"
        description: ""
        variables:
          - name: DRONE_REPO_OWNER
            type: String
            description: ""
            required: false
            value: drone-plugins
