pipeline:
  name: Artifactory Plugin - Elevance Windows Publish
  identifier: artifactory_plugin_elevance_windows_publish
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  properties:
    ci:
      codebase:
        repoName: drone-artifactory
        build: <+input>
  variables:
    - {name: dockerConnector, type: String, value: <+input>.default(dmdockerconn)}
    - {name: windows2019BuilderPool, type: String, value: windows-2019}
    - {name: windows2022BuilderPool, type: String, value: windows-2022}
    - {name: windows2025BuilderPool, type: String, value: windows-2025}
  stages:
    - parallel:
        - stage:
            name: Publish LTSC 2019 candidate
            identifier: publish_ltsc2019_candidate
            type: CI
            spec:
              cloneCodebase: true
              slsa_provenance: {enabled: true}
              platform: {os: Windows, arch: Amd64}
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec: {poolName: <+pipeline.variables.windows2019BuilderPool>, os: Windows}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Verify 17763 and build plugin
                      identifier: verify_build_17763
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: golang:1.25.12-windowsservercore-1809
                        shell: Powershell
                        command: |
                          $ErrorActionPreference = 'Stop'
                          $actual = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' CurrentBuild
                          if ($actual -ne '17763') { throw "Expected Windows build 17763, got $actual" }
                          go test ./...
                          go build -v -buildvcs=false -ldflags "-X main.version=1.9.4-elevance.1 -X main.build=<+pipeline.sequenceId>" -o release/windows/amd64/plugin .
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and publish LTSC 2019 child
                      identifier: push_ltsc2019_child
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: devanshmathur19/drone-artifactory
                        tags: [1.9.4-elevance.1-windows-1809-amd64-r1]
                        dockerfile: docker/Dockerfile.windows.amd64.1809
                        context: .
                        caching: false
                  - step:
                      type: Run
                      name: Contract LTSC 2019 child
                      identifier: contract_ltsc2019_child
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: devanshmathur19/drone-artifactory:1.9.4-elevance.1-windows-1809-amd64-r1
                        shell: Pwsh
                        command: |
                          $ErrorActionPreference = 'Stop'
                          foreach ($command in @('pwsh','jf','jfrog','java','mvn','gradle')) {
                            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) { throw "Missing $command" }
                          }
                          jfrog --version
                          java -version
                          mvn --version
                          gradle --version
            delegateSelectors: [windows-vm]
        - stage:
            name: Publish LTSC 2022 candidate
            identifier: publish_ltsc2022_candidate
            type: CI
            spec:
              cloneCodebase: true
              slsa_provenance: {enabled: true}
              platform: {os: Windows, arch: Amd64}
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec: {poolName: <+pipeline.variables.windows2022BuilderPool>, os: Windows}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Verify 20348 and build plugin
                      identifier: verify_build_20348
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: golang:1.25.12-windowsservercore-ltsc2022
                        shell: Powershell
                        command: |
                          $ErrorActionPreference = 'Stop'
                          $actual = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' CurrentBuild
                          if ($actual -ne '20348') { throw "Expected Windows build 20348, got $actual" }
                          go test ./...
                          go build -v -buildvcs=false -ldflags "-X main.version=1.9.4-elevance.1 -X main.build=<+pipeline.sequenceId>" -o release/windows/amd64/plugin .
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and publish LTSC 2022 child
                      identifier: push_ltsc2022_child
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: devanshmathur19/drone-artifactory
                        tags: [1.9.4-elevance.1-windows-ltsc2022-amd64-r1]
                        dockerfile: docker/Dockerfile.windows.amd64.ltsc2022
                        context: .
                        caching: false
                  - step:
                      type: Run
                      name: Contract LTSC 2022 child
                      identifier: contract_ltsc2022_child
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: devanshmathur19/drone-artifactory:1.9.4-elevance.1-windows-ltsc2022-amd64-r1
                        shell: Pwsh
                        command: |
                          $ErrorActionPreference = 'Stop'
                          foreach ($command in @('pwsh','jf','jfrog','java','mvn','gradle')) {
                            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) { throw "Missing $command" }
                          }
                          jfrog --version
                          java -version
                          mvn --version
                          gradle --version
            delegateSelectors: [windows-vm]
        - stage:
            name: Publish LTSC 2025 candidate
            identifier: publish_ltsc2025_candidate
            type: CI
            spec:
              cloneCodebase: true
              slsa_provenance: {enabled: true}
              platform: {os: Windows, arch: Amd64}
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec: {poolName: <+pipeline.variables.windows2025BuilderPool>, os: Windows}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Verify 26100 and build plugin
                      identifier: verify_build_26100
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: golang:1.25.12
                        shell: Powershell
                        command: |
                          $ErrorActionPreference = 'Stop'
                          $actual = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' CurrentBuild
                          if ($actual -ne '26100') { throw "Expected Windows build 26100, got $actual" }
                          go test ./...
                          go build -v -buildvcs=false -ldflags "-X main.version=1.9.4-elevance.1 -X main.build=<+pipeline.sequenceId>" -o release/windows/amd64/plugin .
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and publish LTSC 2025 child
                      identifier: push_ltsc2025_child
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: devanshmathur19/drone-artifactory
                        tags: [1.9.4-elevance.1-windows-ltsc2025-amd64-r1]
                        dockerfile: docker/Dockerfile.windows.amd64.ltsc2025
                        context: .
                        caching: false
                  - step:
                      type: Run
                      name: Contract LTSC 2025 child
                      identifier: contract_ltsc2025_child
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: devanshmathur19/drone-artifactory:1.9.4-elevance.1-windows-ltsc2025-amd64-r1
                        shell: Pwsh
                        command: |
                          $ErrorActionPreference = 'Stop'
                          foreach ($command in @('pwsh','jf','jfrog','java','mvn','gradle')) {
                            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) { throw "Missing $command" }
                          }
                          jfrog --version
                          java -version
                          mvn --version
                          gradle --version
            delegateSelectors: [windows-vm]
