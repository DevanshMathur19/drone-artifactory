        type: CI
        spec:
          cloneCodebase: true
          platform: {os: Linux, arch: Amd64}
          runtime: {type: Cloud, spec: {}}
          execution:
            steps:
              - step:
                  type: Run
                  name: Verify release source
                  identifier: verify_release_source
                  spec:
                    connectorRef: Plugins_Docker_Hub_Connector
                    image: alpine:3.21
                    shell: Sh
                    command: |
                      set -eu
                      test '<+codebase.commitSha>' = '<+pipeline.variables.expectedCommitSha>'
              - step:
                  type: Plugin
                  name: Publish npm Node 18 manifest
                  identifier: publish_npm_node18_manifest
                  spec:
                    connectorRef: Plugins_Docker_Hub_Connector
                    image: plugins/manifest
                    settings:
