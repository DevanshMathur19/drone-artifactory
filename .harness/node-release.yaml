                        image: plugins/docker:21.3.0
                        settings:
                          username: drone
                          password: <+secrets.getValue("Plugins_Docker_Hub_Pat")>
                          repo: plugins/artifactory
                          dockerfile: docker/Dockerfile.windows.node24.amd64.ltsc2022
                          auto_tag: "true"
                          auto_tag_suffix: npm-windows-node24-nano-ltsc2022-amd64-r1
                      when:
                        stageStatus: Success
                        condition: <+codebase.build.type> == "tag"
                  - step:
                      type: BuildAndPushDockerRegistry
